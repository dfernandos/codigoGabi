# CI: testes unitários (pytest) + E2E (pytest + Playwright) com a app Flask a correr.
name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes unitários
        run: python -m pytest tests/ -v

      - name: Instalar Chromium (Playwright)
        run: python -m playwright install --with-deps chromium

      - name: Preparar BD, subir Flask e E2E
        run: |
          set -e
          rm -f focusfluir.db
          python - <<'PY'
          from app import setup_database, conexao
          setup_database()
          conn = conexao()
          conn.execute(
              "INSERT INTO playlists (id, nome, imagem) VALUES (7, 'CI e2e', ?)",
              (None,),
          )
          conn.commit()
          conn.close()
          PY
          python -c "from app import app; app.run(host='127.0.0.1', port=5000, debug=False, use_reloader=False)" &
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:5000/" > /dev/null; then
              break
            fi
            sleep 1
            if [ "$i" -eq 60 ]; then
              echo "Timeout à espera do Flask"
              exit 1
            fi
          done
          python -m pytest e2e/ -v
